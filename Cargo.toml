[workspace]
resolver = "2"
members = ["crates/bp-core", "crates/bp-blend", "crates/bp-3mf", "src-tauri"]

[workspace.package]
version = "0.0.7"
edition = "2021"
license = "MIT"
authors = ["Arnulfo Vargas Mejia"]
repository = "https://github.com/ArnulfoVargas/blend-parser-app"
rust-version = "1.88"

[workspace.dependencies]
bp-core = { path = "crates/bp-core" }
bp-blend = { path = "crates/bp-blend" }
bp-3mf = { path = "crates/bp-3mf" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 3

# The geometry and painting core runs on every edit: unoptimized, a turn or a cut
# of a large model takes seconds in `tauri dev`.
[profile.dev.package.bp-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
