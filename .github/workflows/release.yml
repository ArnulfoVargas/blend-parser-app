name: Release

# Un tag como alpha-0.0.1 o v0.1.0 compila Windows y Linux y publica un Release.
on:
  push:
    tags: ["alpha-*", "beta-*", "v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BlendParser ${{ github.ref_name }}"
          releaseBody: |
            Versión de prueba de BlendParser: de .blend con materiales a 3MF multicolor para Bambu Studio.

            **Requisito:** Blender 3.6 o posterior instalado (la app lo usa para leer el .blend).

            - Windows: `BlendParser_*_x64-setup.exe` (instalador) o `.msi`.
            - Linux: `.AppImage` (portable) o `.deb` (Debian/Ubuntu).

            Los binarios no están firmados: Windows SmartScreen puede pedir "Más información > Ejecutar de todas formas".
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'alpha-') || startsWith(github.ref_name, 'beta-') }}
