name: Release

# Un tag como alpha-0.0.2 o v0.1.0 compila Windows y Linux, firma los paquetes para
# el actualizador y publica un Release con latest.json. Crea el tag con
# `npm run release -- <versión>` para que tag y versión coincidan.
on:
  push:
    tags: ["alpha-*", "beta-*", "v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: El tag coincide con la versión de la app
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#*-}"; tag="${tag#v}"
          if [ "$app" != "$tag" ]; then echo "El tag $GITHUB_REF_NAME no coincide con la versión $app"; exit 1; fi
      - name: Dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BlendParser ${{ github.ref_name }}"
          releaseBody: |
            Versión de prueba de BlendParser: de .blend con materiales a 3MF multicolor para Bambu Studio.

            **Requisito:** Blender 3.6 o posterior instalado (la app lo usa para leer el .blend).

            - Windows: `BlendParser_*_x64-setup.exe` (instalador) o `.msi`.
            - Linux: `.AppImage` (portable) o `.deb` (Debian/Ubuntu).

            Si ya tienes BlendParser 0.0.2 o posterior, se actualiza solo al abrirlo (en Linux, con el AppImage).

            Los instaladores no llevan firma de código: Windows SmartScreen puede pedir "Más información > Ejecutar de todas formas".
          releaseDraft: false
          # Publicado como versión normal: el actualizador lee releases/latest, que ignora los prereleases.
          prerelease: false
          updaterJsonPreferNsis: true
