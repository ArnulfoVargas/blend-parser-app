name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema (Tauri en Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: node --test scripts/auto-release.test.mjs scripts/publish-signed-windows.test.mjs scripts/validate-updater.test.mjs
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos-build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            arch: Apple Silicon
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            arch: Intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      # PR builds need no updater secret and never upload to a GitHub Release.
      - name: Compilar app y DMG con firma ad hoc
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Comprobar la firma y arquitectura de la app
        env:
          APP_PATH: target/${{ matrix.target }}/release/bundle/macos/BlendParser.app
          EXPECTED_ARCH: ${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}
        run: |
          codesign --verify --deep --strict "$APP_PATH"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")
          lipo -verify_arch "$EXPECTED_ARCH" "$APP_PATH/Contents/MacOS/$executable"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  prepare-release:
    needs: [check, macos-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Comprobar que el commit viene de una PR fusionada
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: context.sha,
            });
            const pr = prs.find(pr => pr.merged_at && pr.base.ref === 'main' && pr.merge_commit_sha === context.sha);
            core.setOutput('merged', Boolean(pr));
            const labels = pr?.labels.map(label => label.name) ?? [];
            core.setOutput('bump', labels.includes('release:major') ? 'major' : labels.includes('release:minor') ? 'minor' : 'patch');
      - uses: actions/checkout@v4
        if: steps.pr.outputs.merged == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.merged == 'true'
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        if: steps.pr.outputs.merged == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.pr.outputs.merged == 'true'
      - name: Preparar dependencias para actualizar Cargo.lock sin cambiar dependencias
        if: steps.pr.outputs.merged == 'true'
        run: cargo fetch --locked
      - name: Reservar versión y tag (sin escribir en main)
        if: steps.pr.outputs.merged == 'true'
        id: version
        env:
          SOURCE_SHA: ${{ github.sha }}
          VERSION_BUMP: ${{ steps.pr.outputs.bump }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/auto-release.mjs

  release:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag != ''
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare-release.outputs.tag }}
    secrets: inherit
