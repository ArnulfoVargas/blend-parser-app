    <linearGradient id="glint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#0B3D2A" stop-opacity="0"/><stop offset="1" stop-color="#0B3D2A" stop-opacity=".22"/></linearGradient>
