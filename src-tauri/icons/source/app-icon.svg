<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Propuesta 1: bandeja AMS. Papel cálido, bandeja verde, cuatro compartimentos de plástico. -->
